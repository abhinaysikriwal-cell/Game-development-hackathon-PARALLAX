<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>GlitchVerse 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Silkscreen:wght@400;700&display=swap">
<style>
:root{
  /* Layout: a single 16:9 arcade cabinet centred on a dark ground; menus are DOM cards laid over the canvas. */
  --ink:#0a0615; --panel:#150d2a; --line:#3a2a6e; --text:#efe9ff; --muted:#a79bd0;
  --cyan:#35f0ff; --pink:#ff3ea5; --amber:#ffc83c; --ice:#9fd8ff; --danger:#ff5468;
  --display:'Silkscreen','Courier New',monospace;
  --body:'Chakra Petch',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0; box-sizing:border-box; background:var(--ink); color:var(--text); font-family:var(--body);
  padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex; align-items:center; justify-content:center;
}
#stage{
  position:relative; aspect-ratio:16/9; container-type:inline-size;
  width:min(100%,calc((100vh - 16px) * 16 / 9));
  width:min(100%,calc((100dvh - 16px) * 16 / 9));
  border:2px solid var(--line); background:#000;
  box-shadow:0 0 0 1px #000,0 0 48px var(--pink);
}
#gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv{pointer-events:none}
#panel{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(6,3,14,.8);
}
.card{
  width:min(90%,64cqw); max-height:94%; overflow:auto; box-sizing:border-box;
  padding:clamp(12px,2.6cqw,30px);
  background:linear-gradient(180deg,#1a1033,#110a24);
  border:2px solid var(--line); box-shadow:6px 6px 0 var(--pink);
}
.title{
  font-family:var(--display); font-weight:700; font-size:clamp(22px,6.4cqw,66px); line-height:1;
  letter-spacing:.04em; margin:0; text-wrap:balance;
  text-shadow:.05em 0 var(--pink),-.05em 0 var(--cyan);
  animation:jit 3.2s steps(1) infinite;
}
@keyframes jit{0%,92%,100%{transform:none}93%{transform:translateX(.04em)}95%{transform:translateX(-.05em) skewX(-4deg)}97%{transform:translateX(.03em)}}
@media (prefers-reduced-motion:reduce){.title{animation:none}}
.sub{font-family:var(--display);color:var(--amber);font-size:clamp(10px,1.7cqw,18px);letter-spacing:.22em;margin:.7em 0 1.2em}
.keys{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:.4em 1.2em;font-size:clamp(11px,1.6cqw,17px);color:var(--muted);align-items:center}
kbd{font-family:var(--display);color:var(--text);background:#0c0620;border:1px solid var(--line);padding:.08em .45em;font-size:.88em;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.6em;margin-top:1.2em}
.lab{font-family:var(--display);font-size:clamp(9px,1.3cqw,14px);letter-spacing:.2em;color:var(--muted)}
.btn{
  font-family:var(--display); font-weight:700; font-size:clamp(11px,1.8cqw,18px); letter-spacing:.1em;
  color:var(--ink); background:var(--amber); border:0; padding:.7em 1.2em; cursor:pointer; box-shadow:3px 3px 0 #000;
}
.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;padding:.55em .9em}
.btn:hover{filter:brightness(1.12)}
.btn:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.h2{font-family:var(--display);font-weight:700;font-size:clamp(16px,3.6cqw,38px);margin:0 0 .5em;letter-spacing:.04em;text-wrap:balance}
.h2.bad{color:var(--danger)} .h2.good{color:var(--cyan)}
.stats{display:grid;grid-template-columns:1fr auto;gap:.35em 1.5em;font-size:clamp(12px,1.8cqw,19px);font-variant-numeric:tabular-nums}
.stats b{color:var(--amber);font-weight:700;text-align:right}
.stats .tot{border-top:1px solid var(--line);padding-top:.5em;margin-top:.3em;color:var(--text)}
.note{color:var(--muted);font-size:clamp(11px,1.5cqw,16px);margin:.2em 0 0}
.rank{font-family:var(--display);font-size:clamp(28px,8cqw,84px);color:var(--amber);line-height:1}
.chars{display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,1.6cqw,18px)}
.card.wide{width:min(94%,78cqw)}
.ch{display:flex;flex-direction:column;gap:.3em;text-align:left;background:#0c0620;color:var(--text);border:2px solid var(--line);padding:.6em;cursor:pointer;font-family:var(--body);min-width:0}
.ch canvas{width:100%;aspect-ratio:8/5;display:block;background:#07030f}
.ch.sel{border-color:var(--amber);box-shadow:4px 4px 0 var(--pink)}
.ch:hover{border-color:var(--text)} .ch.sel:hover{border-color:var(--amber)}
.ch:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.ch .nm{font-family:var(--display);font-weight:700;font-size:clamp(14px,2.6cqw,28px);letter-spacing:.06em}
.ch .rl{font-family:var(--display);color:var(--amber);font-size:clamp(8px,1.2cqw,13px);letter-spacing:.18em}
.ch .bl{color:var(--muted);font-size:clamp(10px,1.4cqw,15px);line-height:1.3}
.ch .story{color:#d6e8b3;font-size:clamp(10px,1.35cqw,14px);line-height:1.4;border-top:1px solid var(--line);padding-top:.45em;margin-top:.2em}
.sw{width:clamp(24px,3.6cqw,40px);height:clamp(18px,2.6cqw,28px);border:2px solid var(--line);padding:0;cursor:pointer}
.sw.on{outline:3px solid var(--amber);outline-offset:1px}
.sw:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.scene-card{text-align:center;background:radial-gradient(ellipse at 50% 10%,rgba(53,240,255,.15),transparent 65%),linear-gradient(180deg,#1a1033,#080516);animation:sceneIn .55s ease-out both}
.scene-card .note{max-width:42em;margin:1em auto;line-height:1.5}
.ending-emblem{font-size:clamp(36px,8cqw,82px);line-height:1.1;margin:.12em auto .3em;color:#b7e96c;text-shadow:0 0 18px rgba(183,233,108,.8);animation:seedPulse 2.4s ease-in-out infinite}
@keyframes seedPulse{50%{transform:scale(1.12);filter:brightness(1.35)}}
@keyframes sceneIn{from{opacity:0;transform:scale(.97);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
</style>

<div id="stage">
  <canvas id="gl" aria-label="GlitchVerse game screen"></canvas>
  <canvas id="cv" width="1920" height="1080"></canvas>
  <div id="panel" role="dialog" aria-live="polite"></div>
</div>

<script src="sfx.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),panel=document.getElementById('panel');
const T=30,COLS=32,ROWS=18,W=960,H=540,SS=2;
const CY='#35f0ff',PK='#ff3ea5',AM='#ffc83c',ICE='#9fd8ff',DG='#ff5468';

/* ---------- tuning ---------- */
const SPEED=235,ACC_G=3200,ACC_A=1900,GRAV=2100,JUMP=650,MAXV=760,COY=.1,BUF=.12,STEP=1/120;
const FDRAIN=40,FREGEN=16;

/* ---------- levels ---------- */
function mk(fn){
  const g=Array.from({length:ROWS},()=>Array(COLS).fill('.'));
  for(let c=0;c<COLS;c++){g[0][c]='#';g[ROWS-1][c]='#'}
  for(let r=0;r<ROWS;r++){g[r][0]='#';g[r][COLS-1]='#'}
  const fill=(c1,r1,c2,r2,ch)=>{for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)g[r][c]=ch};
  fn(fill,(c,r,ch)=>{g[r][c]=ch});
  return g.map(r=>r.join(''));
}
const BIOMES=[{name:'NEON RUINS',tag:'THE CITY THAT FORGOT ITS SKY'},{name:'RAINFALL FOUNDRY',tag:'THE STORM NEVER STOPS HERE'},{name:'LAST LIGHT RAILWAY',tag:'THE MOUNTAIN LINE RUNS THROUGH A BROKEN WORLD'},{name:'LAVA GLITCH CORE',tag:'THE WORLD BURNS FROM WITHIN'},{name:'MOSSROOT MAZE',tag:'THE FOREST HIDES AN ANCIENT SHRINE'}];
const BIOME_STYLES=[{line:'#3a2a6e',cyan:'#35f0ff',pink:'#ff3ea5',ink:'#0a0615',wall:0x2b1d6b,edge:0x7a68d8,glow:'rgba(53,240,255,.32)'},{line:'#526f88',cyan:'#8bdcff',pink:'#d6b0ff',ink:'#08111b',wall:0x203a68,edge:0x8bdcff,glow:'rgba(139,220,255,.34)'},{line:'#79583e',cyan:'#ffc46b',pink:'#d9b8ff',ink:'#100d12',wall:0x443329,edge:0xffc46b,glow:'rgba(255,167,82,.38)'},{line:'#a14b2e',cyan:'#ff913c',pink:'#ff3d8b',ink:'#170805',wall:0x351845,edge:0xff913c,glow:'rgba(255,113,45,.38)'},{line:'#55703b',cyan:'#b7e96c',pink:'#f3ad54',ink:'#0a1309',wall:0x324b31,edge:0xb7e96c,glow:'rgba(137,204,83,.38)'}];
const CUTSCENES=[{title:'A KEY IN THE DARK',body:'The GlitchVerse has fractured into unstable worlds. A moonlit key is the first spark of hope. Cross the quiet ruins, open the sealed gate, and begin restoring the paths between biomes.'},{title:'RAINFALL FOUNDRY',body:'The city signal ends in a storm soaked factory. Rain hides the moving gears, and the old machines are waking up.'},{title:'LAST LIGHT RAILWAY',body:'The mountain railway is still running, though no one remembers who is driving. Cross the signal yard, dodge the phantom express, and find the switch key before the tunnel swallows the last light.'},{title:'LAVA GLITCH CORE',body:'Deep below the forest, the corrupted core leaks molten light. Reach it before the whole world breaks apart.'},{title:'THE MOSSROOT SHRINE',body:'A forgotten maze circles the oldest tree in the GlitchVerse. The Root Guardian wakes beneath the moss. Stomp its crown three times, claim the shrine key, and restore the paths between worlds.'}];
const LEVELS=[
 {name:'BOOT SEQUENCE',par:15,limit:140,mech:{flip:1},start:[2,16],exit:[30,16],key:[18,16],
  tip:'Collect the moonlit key on the ground path to open the exit wall. Jump over the low stone tiles; G or X flips gravity if you want to try it.',
  map:mk((f)=>{f(12,16,13,16,'#');f(23,16,24,16,'#');f(29,1,29,16,'D');}),
  coins:[[7,15],[8,15],[15,15],[16,15],[22,15],[25,15],[28,15]],plats:[],saws:[]},
 {name:'FROZEN GEARS',par:40,limit:120,mech:{flip:1,freeze:1},start:[2,16],exit:[30,16],
  tip:'Touch the glowing checkpoint crystal to save your progress. Hold F to freeze moving hazards; freezing drains energy.',
  map:mk((f)=>{f(8,16,17,16,'^');f(20,12,21,16,'#');}),
  coins:[[11,1],[14,1],[11,13],[16,15],[25,9],[28,15]],
  plats:[{c:9,r:14,w:3,axis:'x',range:5,speed:70}],
  saws:[{c:23,r:1,axis:'y',range:14,speed:145},{c:26,r:15,axis:'y',range:-14,speed:145},{c:13,r:8,axis:'x',range:5,speed:100}],checkpoints:[[5,16]]},
 {name:'LAST LIGHT RAILWAY',par:85,limit:200,mech:{flip:1,freeze:1,dim:1},start:[2,16],exit:[30,16],key:[27,2],
  tip:'Touch the checkpoint crystal near the tracks. Watch the signal lights and freeze the phantom express to cross safely; the key opens the exit gate.',
  map:mk((f,s)=>{
    f(6,12,7,16,'#');f(10,9,11,16,'A');f(13,15,17,15,'^');
    f(14,11,18,11,'B');f(19,8,20,16,'#');f(22,13,25,13,'A');
    f(24,7,25,7,'#');f(8,5,12,5,'B');f(15,3,19,3,'A');
    f(21,5,23,5,'#');f(29,1,29,16,'D');s(27,2,'B');
  }),
  coins:[[4,11],[8,8],[12,3],[16,9],[20,1],[24,10],[27,2],[28,12]],checkpoints:[[12,16]],
  plats:[{c:7,r:10,w:2,axis:'x',range:3,speed:75},{c:21,r:10,w:2,axis:'y',range:4,speed:68}],
  saws:[{c:14,r:1,axis:'x',range:12,speed:210},{c:25,r:9,axis:'y',range:6,speed:170},{c:12,r:7,axis:'x',range:7,speed:160},{c:22,r:2,axis:'x',range:5,speed:185}]},
 {name:'TOTAL GLITCH',par:70,limit:170,mech:{flip:1,freeze:1,dim:1},start:[2,16],exit:[30,16],
  tip:'Touch the early checkpoint crystal to save your progress. Switch dimensions at the central pillar, then flip gravity and head-hit the raised fire block twice for the key.',
  map:mk((f,s)=>{f(11,16,20,16,'^');f(15,1,15,8,'A');s(25,3,'2');f(29,1,29,16,'D');}),
  key:[24,4],smashBlocks:[[25,3,2]],coins:[[4,16],[13,1],[18,1],[27,15],[27,2]],checkpoints:[[4,16]],plats:[],
  saws:[{c:6,r:1,axis:'y',range:14,speed:170},{c:21,r:8,axis:'x',range:7,speed:160},{c:27,r:10,axis:'y',range:6,speed:180}]},
 {name:'MOSSROOT MAZE',par:105,limit:240,mech:{flip:1,freeze:1,dim:1},start:[2,16],exit:[30,16],key:[27,2],boss:{x:24*T,y:510-64,w:66,h:64,hp:3},
  tip:'Touch the checkpoint crystal. Stomp the Root Guardian three times to release the shrine key, then climb the maze for the key and reach the exit.',
  map:mk((f,s)=>{
    f(5,12,6,16,'A');f(8,15,11,15,'^');f(9,11,14,11,'#');
    f(14,7,15,10,'B');f(17,10,21,10,'#');f(21,11,21,15,'A');
    f(23,14,23,14,'#');f(28,14,28,14,'#');f(26,8,26,13,'#');f(7,5,10,5,'#');
    f(11,5,13,5,'A');f(18,4,22,4,'B');f(14,8,17,8,'#');
    f(18,15,22,15,'^');f(29,1,29,16,'D');s(27,2,'A');s(24,9,'B');
  }),
  coins:[[3,13],[7,9],[12,8],[16,3],[18,12],[23,6],[26,2],[28,12]],checkpoints:[[14,16]],
  plats:[{c:10,r:14,w:3,axis:'x',range:4,speed:82},{c:22,r:8,w:2,axis:'y',range:3,speed:58}],
  saws:[{c:12,r:8,axis:'x',range:4,speed:95},{c:19,r:6,axis:'y',range:4,speed:115}]}
];

/* ---------- state ---------- */
let state='menu',lvl=0,lives=3,total=0,totalTime=0,L,P,dim=0,energy=100,lock=false,freezing=false;
let levelTime=0,lvlCoins=0,dyingT=0,celebrateT=0,deathMsg='',shake=0,glitchT=0,tipT=0,tutorialStep=0,toastT=0,toastTxt='',toastCol=AM,bgT=0,flashT=0;
let particles=[],acc=0,muted=false,pendingLvl=0;
const keys={left:0,right:0,jump:0,f:0};

const isSolid=(ch,d=dim)=>ch==='#'||ch==='D'||ch==='1'||ch==='2'||(ch==='A'&&d===0)||(ch==='B'&&d===1);
const tileAt=(c,r)=>(c<0||c>=COLS||r<0||r>=ROWS)?'#':L.g[r][c];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const approach=(v,t,a)=>v<t?Math.min(v+a,t):Math.max(v-a,t);

function loadLevel(i){
  lvl=i;const d=LEVELS[i];applyBiomeTheme();tutorialStep=i===0?0:4;
  L={d,g:d.map.map(r=>r.split('')),
    coins:d.coins.map(([c,r])=>({x:(c+.5)*T,y:(r+.5)*T,got:false,ph:Math.random()*6})),
    plats:d.plats.map(p=>({x:p.c*T,y:p.r*T,w:p.w*T,h:12,x0:p.c*T,y0:p.r*T,axis:p.axis,range:Math.abs(p.range)*T,sign:Math.sign(p.range),speed:p.speed,off:0,dir:1,dx:0,dy:0})),
    saws:d.saws.map(s=>({x:(s.c+.5)*T,y:(s.r+.5)*T,x0:(s.c+.5)*T,y0:(s.r+.5)*T,axis:s.axis,range:Math.abs(s.range)*T,sign:Math.sign(s.range),speed:s.speed,off:0,dir:1,rot:0})),
    smashBlocks:(d.smashBlocks||[]).map(([c,r,need])=>({c,r,need,hits:0,broken:false})),
    boss:d.boss?{...d.boss,x0:d.boss.x,dir:1,hp:d.boss.hp,maxHp:d.boss.hp,mode:'stalk',modeT:2.2,hitCd:0,flash:0,defeated:false}:null,
    checkpoints:(d.checkpoints||[]).map(([c,r])=>({c,r,x:(c+.5)*T,y:(r+.5)*T,active:false})),checkpoint:null,
    key:d.key?{x:(d.key[0]+.5)*T,y:(d.key[1]+.5)*T,got:false,unlocked:!(d.smashBlocks&&d.smashBlocks.length)&&!d.boss}:null};
  P={x:d.start[0]*T+5,y:(d.start[1]+1)*T-26,w:20,h:26,vx:0,vy:0,g:1,on:false,coy:0,buf:0,flipCd:0,dimCd:0,face:1,ride:null,jumping:false};
  L.checkpoint={x:P.x,y:P.y,g:1,dim:0,active:false};
  dim=0;energy=100;lock=false;freezing=false;levelTime=0;lvlCoins=0;particles=[];tipT=7;toastT=0;glitchT=0;shake=0;celebrateT=0;acc=0;build3D();
}

/* ---------- audio ---------- */
const sfx={
  jump:()=>window.SFX&&SFX.jump(),
  flip:()=>window.SFX&&SFX.flipGravity(P.g<0),
  dim:()=>window.SFX&&SFX.dimensionSwitch(dim?'B':'A'),
  coin:()=>window.SFX&&SFX.pickup(),
  key:()=>window.SFX&&SFX.pickup(),
  checkpoint:()=>window.SFX&&SFX.pickup(),
  die:()=>window.SFX&&SFX.death(),
  deny:()=>window.SFX&&SFX.cooldown(),
  freeze:()=>window.SFX&&SFX.freezeStart(),
  unfreeze:()=>window.SFX&&SFX.freezeEnd(),
  land:(strength)=>window.SFX&&SFX.land(strength),
  block:(broken)=>window.SFX&&SFX.smashBlock(broken),
  footstep:()=>window.SFX&&SFX.footstep(),
  clear:()=>window.SFX&&SFX.levelComplete()
};

/* ---------- helpers ---------- */
function burst(x,y,col,n,sp=220){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.5,col,sz:2+Math.random()*3})}
}
function toast(t,c=AM){toastTxt=t;toastCol=c;toastT=1.4}
function spikeBox(c,r){
  const down=tileAt(c,r-1)==='#'&&tileAt(c,r+1)!=='#';
  return down?{x:c*T+5,y:r*T,w:T-10,h:T-13,down:true}:{x:c*T+5,y:r*T+13,w:T-10,h:T-13,down:false};
}

/* ---------- actions ---------- */
function tryFlip(){
  if(state!=='play'||!L.d.mech.flip||P.flipCd>0)return;
  P.g*=-1;if(lvl===0&&tutorialStep===2)tutorialStep=3;P.flipCd=.3;P.on=false;P.coy=0;P.jumping=false;shake=Math.max(shake,4);
  burst(P.x+10,P.y+13,'#fff',10,140);sfx.flip();
}
function tryDim(){
  if(state!=='play'||!L.d.mech.dim||P.dimCd>0)return;
  const nd=1-dim,c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.001)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(isSolid(tileAt(c,r),nd)){sfx.deny();toast('BLOCKED: YOU ARE INSIDE A WALL',DG);shake=Math.max(shake,5);P.dimCd=.2;return}
  }
  dim=nd;P.dimCd=.22;glitchT=.32;shake=Math.max(shake,6);burst(P.x+10,P.y+13,nd?PK:CY,18,200);sfx.dim();
}
function die(reason){
  if(state!=='play')return;
  lives--;state='dying';dyingT=.9;deathMsg=reason;
  burst(P.x+10,P.y+13,'#fff',36,300);burst(P.x+10,P.y+13,PK,16,260);shake=14;sfx.die();
}
function respawnAtCheckpoint(){
  const cp=L.checkpoint;
  P={x:cp.x,y:cp.y,w:20,h:26,vx:0,vy:0,g:1,on:true,coy:COY,buf:0,flipCd:0,dimCd:0,face:1,ride:null,jumping:false};
  dim=cp.dim;energy=100;lock=false;freezing=false;keys.f=0;if(window.SFX)SFX.setAmbientDimension(dim?'B':'A');
  for(const p of L.plats){p.x=p.x0;p.y=p.y0;p.off=0;p.dir=1}
  for(const s of L.saws){s.x=s.x0;s.y=s.y0;s.off=0;s.dir=1;s.rot=0}
  build3D();state='play';toast('BACK TO CHECKPOINT',ICE);
}
function applyBiomeTheme(){
  const t=BIOME_STYLES[lvl];

function act(a){
  if(a==='start')showSelect(0);

  else if(a==='play')startRun(pendingLvl);
  else if(a.startsWith('skin:'))pickSkin(charId,+a.slice(5));
  else if(a.startsWith('pick:'))pickChar(a.slice(5));
  else if(a.startsWith('lvl:'))showSelect(+a.slice(4));
  else if(a==='next'){if(lvl<LEVELS.length-1)showCutscene(lvl+1);else showEndingScene()}

  else if(a==='restart'){if(lvl===4)lives=5;loadLevel(lvl);state='play';hide()}
  else if(a==='menu'){if(window.SFX)SFX.stopAmbient();showMenu();}
}

/* ---------- input ---------- */
const HELD={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyF:'f',KeyZ:'f'};
const GAMEKEYS=new Set([...Object.keys(HELD),'ArrowDown','KeyG','KeyX','KeyE','ShiftLeft','ShiftRight','KeyR','KeyP','Escape','KeyM','KeyN','Enter']);
addEventListener('keydown',e=>{
  if(!GAMEKEYS.has(e.code))return;
  const onBtn=document.activeElement&&document.activeElement.tagName==='BUTTON';
  if(!(e.code==='Space'&&onBtn&&!panel.hidden))e.preventDefault();
  if(HELD[e.code]){keys[HELD[e.code]]=1;if(HELD[e.code]==='jump'&&!e.repeat&&state==='play')P.buf=BUF}
  if(e.repeat)return;
  if(state==='select'){
    if(e.code==='Escape'){showMenu();return}
    if(e.code==='ArrowLeft'||e.code==='KeyA'||e.code==='ArrowRight'||e.code==='KeyD'){pickChar(CHARS[(CHARS.findIndex(c=>c.id===charId)+1)%CHARS.length].id);return}
  }
  if(state==='cutscene'&&e.code==='Escape'){enterPendingLevel();return}
  if(e.code==='Enter'){const b=panel.querySelector('[data-primary]');if(!panel.hidden&&b)b.click();return}
  if(e.code==='KeyG'||e.code==='KeyX')tryFlip();
  else if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight')tryDim();
  else if(e.code==='KeyR'&&(state==='play'||state==='pause'||state==='dying')){loadLevel(lvl);state='play';hide()}
  else if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')showPause();else if(state==='pause')act('resume')}
  else if(e.code==='KeyM'){muted=!muted;if(window.SFX)SFX.mute(muted);}
  else if(e.code==='KeyN'&&state==='play'){if(lvl<LEVELS.length-1)loadLevel(lvl+1);}
});
addEventListener('keyup',e=>{if(HELD[e.code])keys[HELD[e.code]]=0});
addEventListener('blur',()=>{keys.left=keys.right=keys.jump=keys.f=0;if(state==='play')showPause()});

/* ---------- simulation ---------- */
function moveX(dx){
  P.x+=dx;
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.001)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    if(isSolid(tileAt(c,r))){if(dx>0)P.x=c*T-P.w;else if(dx<0)P.x=(c+1)*T;P.vx=0;return}
  }
  for(const pl of L.plats)if(overlap(P,pl)){if(dx>0)P.x=pl.x-P.w;else if(dx<0)P.x=pl.x+pl.w;P.vx=0}
}
function smashBlock(c,r){
  const block=L.smashBlocks.find(b=>b.c===c&&b.r===r&&!b.broken);if(!block)return;
  block.hits++;shake=Math.max(shake,2.5);sfx.block(block.hits>=block.need);
  burst((c+.5)*T,(r+.5)*T,block.hits>=block.need?'#ff9a35':'#ffbf52',block.hits>=block.need?16:7,115);
  if(block.hits>=block.need){block.broken=true;L.g[r][c]='.';const remaining=L.smashBlocks.filter(b=>!b.broken).length;
    if(remaining===0&&L.key){L.key.unlocked=true;toast('ALL BLOCKS SMASHED — KEY RELEASED!',AM);burst(L.key.x,L.key.y,'#ffd35b',22,180)}
    else toast('BLOCK BROKEN — '+remaining+' LEFT',AM);
  }else toast('HEAD HIT '+block.hits+'/'+block.need+' — HIT IT AGAIN',AM);
}
function moveY(dy){
  P.y+=dy;
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.001)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
    const ch=tileAt(c,r);
    if(isSolid(ch)){
      if((ch==='1'||ch==='2')&&((P.g>0&&dy<0)||(P.g<0&&dy>0)))smashBlock(c,r);
      if(dy>0){P.y=r*T-P.h;if(P.g>0)P.on=true}else if(dy<0){P.y=(r+1)*T;if(P.g<0)P.on=true}
      P.vy=0;return;
    }
  }
  for(const pl of L.plats)if(overlap(P,pl)){
    if(dy>0){P.y=pl.y-P.h;if(P.g>0){P.on=true;P.ride=pl}}
    else if(dy<0){P.y=pl.y+pl.h;if(P.g<0){P.on=true;P.ride=pl}}
    P.vy=0;
  }
}
function tileOverlap(){
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.001)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(isSolid(tileAt(c,r)))return true;
  return false;
}
function step(dt){
  if(state!=='play')return;
  /* time freeze */
  const want=keys.f&&L.d.mech.freeze;
  if(lock&&energy>=30)lock=false;
  const was=freezing;
  freezing=!!want&&!lock&&energy>0;
  if(freezing&&!was)sfx.freeze();
  if(!freezing&&was)sfx.unfreeze();
  if(freezing){energy=Math.max(0,energy-FDRAIN*dt);if(energy===0){lock=true;toast('FREEZE ENERGY EMPTY',ICE)}}
  else energy=Math.min(100,energy+FREGEN*dt);
  levelTime+=dt;
  if(L.boss&&!L.boss.defeated){const b=L.boss;b.hitCd=Math.max(0,b.hitCd-dt);b.flash=Math.max(0,b.flash-dt);if(!freezing&&Math.abs(P.x+P.w/2-(b.x+b.w/2))<280){b.modeT-=dt;if(b.mode==='stalk'){b.x+=Math.sin(levelTime*1.4)*22*dt;if(b.modeT<=0){b.mode='warn';b.modeT=1.1;toast('ROOT GUARDIAN CHARGING — JUMP!',DG)}}else if(b.mode==='warn'&&b.modeT<=0){b.mode='charge';b.modeT=.58;b.dir=P.x+P.w/2>b.x+b.w/2?1:-1}else if(b.mode==='charge'){b.x=clamp(b.x+b.dir*185*dt,b.x0-28,b.x0+98);if(b.modeT<=0){b.mode='stalk';b.modeT=2.2}}}}
  if(levelTime>=L.d.limit){die('Time ran out');return}
  P.flipCd=Math.max(0,P.flipCd-dt);P.dimCd=Math.max(0,P.dimCd-dt);
  /* moving world */
  for(const pl of L.plats){
    pl.dx=pl.dy=0;if(freezing)continue;
    pl.off+=pl.speed*dt*pl.dir;
    if(pl.off>pl.range){pl.off=pl.range;pl.dir=-1}else if(pl.off<0){pl.off=0;pl.dir=1}
    const nx=pl.axis==='x'?pl.x0+pl.sign*pl.off:pl.x,ny=pl.axis==='y'?pl.y0+pl.sign*pl.off:pl.y;
    pl.dx=nx-pl.x;pl.dy=ny-pl.y;pl.x=nx;pl.y=ny;
  }
  if(!freezing)for(const s of L.saws){
    s.off+=s.speed*dt*s.dir;
    if(s.off>s.range){s.off=s.range;s.dir=-1}else if(s.off<0){s.off=0;s.dir=1}
    if(s.axis==='x')s.x=s.x0+s.sign*s.off;else s.y=s.y0+s.sign*s.off;
    s.rot+=dt*8*s.dir;
  }
  if(P.ride){P.x+=P.ride.dx;P.y+=P.ride.dy}
  P.ride=null;
  /* player */
  const dirx=(keys.right?1:0)-(keys.left?1:0);
  if(lvl===0&&tutorialStep===0&&dirx)tutorialStep=1;
  P.vx=approach(P.vx,dirx*SPEED,(P.on?ACC_G:ACC_A)*dt);
  if(dirx)P.face=dirx;
  P.buf=Math.max(0,P.buf-dt);
  P.coy=P.on?COY:Math.max(0,P.coy-dt);
  if(P.buf>0&&P.coy>0){if(lvl===0&&tutorialStep===1)tutorialStep=2;P.vy=-JUMP*P.g;P.buf=0;P.coy=0;P.jumping=true;P.on=false;sfx.jump();burst(P.x+10,P.y+(P.g>0?26:0),'#bbb',5,60)}
  if(P.jumping&&!keys.jump&&P.vy*P.g<0){P.vy*=.5;P.jumping=false}
  if(P.vy*P.g>=0)P.jumping=false;
  P.vy=clamp(P.vy+GRAV*P.g*dt,-MAXV,MAXV);
  const wasGrounded=P.on;
  P.on=false;
  moveX(P.vx*dt);
  const impactSpeed=Math.abs(P.vy),prevBottom=P.y+P.h,prevTop=P.y,prevVy=P.vy;
  moveY(P.vy*dt);
  if(P.on&&!wasGrounded&&impactSpeed>120){sfx.land(Math.min(1.5,impactSpeed/600));burst(P.x+10,P.g>0?P.y+P.h:P.y,dim?PK:'#b9d7ed',8,70)}
  footstepTimer-=dt;
  if(P.on&&Math.abs(dirx)>0&&!freezing&&footstepTimer<=0){sfx.footstep();footstepTimer=.22;}
  /* pushed by platforms */
  for(const pl of L.plats)if(overlap(P,pl)){
    const ox=Math.min(P.x+P.w-pl.x,pl.x+pl.w-P.x),oy=Math.min(P.y+P.h-pl.y,pl.y+pl.h-P.y);
    if(ox<oy)P.x+=(P.x+P.w/2<pl.x+pl.w/2)?-ox:ox;else P.y+=(P.y+P.h/2<pl.y+pl.h/2)?-oy:oy;
  }
  if(tileOverlap()){die('Crushed');return}
  if(L.boss&&!L.boss.defeated&&overlap(P,L.boss)){const b=L.boss;if(((P.g===1&&prevVy>0&&prevBottom<=b.y+25)||(P.g===-1&&prevVy<0&&prevTop>=b.y+b.h-25))&&b.hitCd<=0){b.hp--;b.hitCd=.72;b.flash=.3;b.mode='stalk';b.modeT=1.25;P.y=P.g===1?b.y-P.h:b.y+b.h;P.vy=-JUMP*.76*P.g;P.on=false;P.jumping=true;shake=Math.max(shake,7);burst(b.x+b.w/2,b.y,'#b7e96c',20,185);sfx.block(b.hp===0);if(b.hp<=0){b.hp=0;b.defeated=true;b.mode='defeated';if(L.key)L.key.unlocked=true;toast('ROOT GUARDIAN DEFEATED — SHRINE KEY RELEASED!',AM);burst(b.x+b.w/2,b.y+20,'#ffd66d',42,260);burst(b.x+b.w/2,b.y+20,'#b7e96c',38,220)}else toast('ROOT GUARDIAN HIT — '+b.hp+' STOMPS LEFT',AM)}else if(b.hitCd<=0){die('Struck by the Root Guardian');return}}
  /* hazards */
  const c0=Math.floor(P.x/T),c1=Math.floor((P.x+P.w-.001)/T),r0=Math.floor(P.y/T),r1=Math.floor((P.y+P.h-.001)/T);
  for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++)if(tileAt(c,r)==='^'&&overlap(P,spikeBox(c,r))){die('Impaled on a spike');return}
  if(!freezing)for(const s of L.saws){
    const nx=clamp(s.x,P.x+2,P.x+P.w-2),ny=clamp(s.y,P.y+2,P.y+P.h-2);
    if((s.x-nx)**2+(s.y-ny)**2<121){die('Sliced by a saw');return}
  }
  if(P.y<-80||P.y>H+80||P.x<-80||P.x>W+80){die('Lost in the void');return}
  /* pickups */

    const nx=clamp(c.x,P.x,P.x+P.w),ny=clamp(c.y,P.y,P.y+P.h);
    if((c.x-nx)**2+(c.y-ny)**2<100){c.got=true;lvlCoins++;sfx.coin();burst(c.x,c.y,AM,10,120)}
  }
  for(const cp of L.checkpoints){

    if(overlap(P,trigger)){

    }
  }
  if(L.key&&!L.key.got&&L.key.unlocked){
    const k=L.key,nx=clamp(k.x,P.x,P.x+P.w),ny=clamp(k.y,P.y,P.y+P.h);
    if((k.x-nx)**2+(k.y-ny)**2<144){
      k.got=true;celebrateT=.8;sfx.key();burst(k.x,k.y,AM,24,200);burst(P.x+10,P.y+13,'#fff0a6',12,95);toast(L.g.some(row=>row.includes('D'))?'KEY FOUND. THE DOOR IS OPEN':'KEY COLLECTED!',AM);
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(L.g[r][c]==='D'){L.g[r][c]='.';burst(c*T+15,r*T+15,AM,2,80)}
    }
  }
  const ex={x:L.d.exit[0]*T+6,y:L.d.exit[1]*T+2,w:T-12,h:T-4};

function wrapText(txt,maxW){

}

function drawBiomeWeather(t){
  if(state!=='play')return;ctx.save();
  if(lvl===1){ctx.strokeStyle=dim?'rgba(210,190,255,.28)':'rgba(170,215,255,.34)';ctx.lineWidth=1.2;for(let i=0;i<100;i++){const x=((i*97-t*145)%W+W)%W,y=((i*67+t*310)%H+H)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-5,y+16);ctx.stroke()}}
  if(lvl===2){for(let i=0;i<30;i++){const x=((i*113-t*(12+i%4))%W+W)%W,y=((i*71+Math.sin(t+i)*8)%H);ctx.fillStyle=dim?'rgba(217,184,255,.18)':'rgba(210,222,232,.16)';ctx.beginPath();ctx.ellipse(x,y,10+i%9,3+i%3,0,0,Math.PI*2);ctx.fill()}}
  if(lvl===3){for(let i=0;i<46;i++){const x=((i*83+Math.sin(t*1.7+i)*18)%W+W)%W,y=((i*61-t*(12+i%6))%H+H)%H;ctx.fillStyle=i%4===0?'rgba(255,220,110,.9)':'rgba(255,104,35,.76)';ctx.fillRect(x,y,1+i%3,2+i%4)}const pulse=(Math.sin(t*1.15-1.1)+1)/2;if(pulse>.91){ctx.fillStyle='rgba(255,84,23,'+((pulse-.91)*.65)+')';ctx.fillRect(0,0,W,H);for(const x of [300,660]){ctx.fillStyle='rgba(255,126,40,'+((pulse-.91)*2)+')';ctx.beginPath();ctx.ellipse(x,H-72,28,70,0,0,Math.PI*2);ctx.fill()}}}
  if(lvl===4){for(let i=0;i<34;i++){const x=((i*101+Math.sin(t*.8+i)*24)%W+W)%W,y=((i*59+t*(3+i%4))%H+H)%H;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t+i)*.7);ctx.fillStyle=i%2?'rgba(183,233,108,.55)':'rgba(238,199,103,.5)';ctx.beginPath();ctx.ellipse(0,0,3,1.5,0,0,Math.PI*2);ctx.fill();ctx.restore()}}
  if(lvl===2){ctx.fillStyle=dim?'rgba(217,184,255,.24)':'rgba(255,194,113,.24)';for(let i=0;i<50;i++){const x=((i*89-t*(18+i%5))%W+W)%W,y=((i*53+Math.sin(t+i)*8)%H);ctx.fillRect(x,y,2+i%3,1+i%2)}if(Math.sin(t*2.2)>.94){ctx.fillStyle='rgba(255,70,55,.45)';ctx.fillRect(0,0,W,H)}}
  ctx.restore();
}
function draw(t){
  render3D(t);
  const k=cv.width/W;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.setTransform(k,0,0,k,0,0);

/* ---------- main loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){acc+=dt;while(acc>=STEP&&state==='play'){step(STEP);acc-=STEP}if(!freezing)bgT+=dt;tipT=Math.max(0,tipT-dt)}
  else if(state==='dying'){
    dyingT-=dt;
    if(dyingT<=0){if(lives>0){if(L.checkpoint&&L.checkpoint.active)respawnAtCheckpoint();else{loadLevel(lvl);state='play'}}else gameOver()}
  }
  for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt}
  particles=particles.filter(p=>p.life>0);
